services:
  postgres:
    image: postgres:16-alpine
    container_name: terrace-prospector-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: terrace_prospector
    ports:
      - "5432:5432"
    volumes:
      - terrace_prospector_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: terrace-prospector-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - terrace_prospector_redis:/data

volumes:
  terrace_prospector_pgdata:
  terrace_prospector_redis:
